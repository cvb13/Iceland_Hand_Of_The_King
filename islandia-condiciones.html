<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132630">
<title>Islandia 27 sep – 7 oct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --basalt:#132630;      /* fondo, basalto mojado */
  --basalt-2:#1B3340;    /* tarjeta */
  --basalt-3:#254456;    /* borde */
  --glacier:#9FD4E3;     /* acento agua de deshielo */
  --moss:#7BA860;        /* ok */
  --amber:#E0A53F;       /* ojo */
  --lava:#C24530;        /* alto */
  --text:#EAF1F4;
  --muted:#93A9B6;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--basalt);
  color:var(--text);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}
button{font-family:inherit;color:inherit}
a{color:var(--glacier)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- cabecera ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--basalt) 72%,rgba(19,38,48,0));
  padding:12px 0 10px;
}
.bar{display:flex;align-items:baseline;gap:10px}
.clock{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.daychip{margin-left:auto;font-size:12px;color:var(--muted)}
.refresh{background:none;border:1px solid var(--basalt-3);border-radius:999px;
  padding:4px 11px;font-size:12px;color:var(--muted)}
.refresh:active{background:var(--basalt-2)}

/* ---------- selector de día ---------- */
.days{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{
  flex:0 0 auto;border:1px solid var(--basalt-3);background:var(--basalt-2);
  border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);
  white-space:nowrap;line-height:1.2;text-align:left
}
.day b{display:block;font-size:15px;color:var(--text);font-weight:600}
.day.on{border-color:var(--glacier);background:#22404F}
.day.on b{color:var(--glacier)}

/* ---------- veredicto ---------- */
.verdict{
  border-radius:16px;padding:16px;margin:10px 0 14px;
  border:1px solid var(--basalt-3);background:var(--basalt-2);box-shadow:var(--shadow);
  border-left-width:5px;
}
.verdict.ok{border-left-color:var(--moss)}
.verdict.warn{border-left-color:var(--amber)}
.verdict.stop{border-left-color:var(--lava)}
.verdict h1{font-size:22px;line-height:1.2;margin:0 0 4px;letter-spacing:-.02em;font-weight:700}
.verdict.ok h1{color:var(--moss)}
.verdict.warn h1{color:var(--amber)}
.verdict.stop h1{color:var(--lava)}
.leg{font-size:13px;color:var(--muted);margin:0 0 10px}
.reasons{list-style:none;margin:0;padding:0;font-size:14px}
.reasons li{display:flex;gap:8px;padding:4px 0;border-top:1px solid rgba(255,255,255,.06)}
.reasons li:first-child{border-top:0}
.reasons .k{color:var(--muted);flex:0 0 96px}
.reasons .v{flex:1}
.big{font-size:34px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- tarjetas ---------- */
section{margin:0 0 14px}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.01em}
.card{background:var(--basalt-2);border:1px solid var(--basalt-3);border-radius:14px;padding:14px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(255,255,255,.06)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.time{flex:0 0 46px;font-size:13px;color:var(--glacier);font-variant-numeric:tabular-nums;padding-top:1px}
.what{flex:1;min-width:0}
.what b{font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:2px}
.now{background:#22404F;margin:0 -8px;padding:9px 8px;border-radius:9px;border-top:0}

/* ---------- viento por parada ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.wp{flex:0 0 108px;background:var(--basalt-2);border:1px solid var(--basalt-3);
  border-radius:12px;padding:10px}
.wp .nm{font-size:11.5px;color:var(--muted);height:28px;overflow:hidden;line-height:1.2}
.wp .g{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.wp .g s{text-decoration:none;font-size:11px;font-weight:500;color:var(--muted)}
.wp .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.wp.g-ok .g{color:var(--moss)} .wp.g-warn .g{color:var(--amber)} .wp.g-stop .g{color:var(--lava)}

/* ---------- barra de luz ---------- */
.light{height:34px;border-radius:9px;overflow:hidden;display:flex;margin-top:6px;
  border:1px solid var(--basalt-3)}
.light i{display:block;height:100%}
.lseg{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px}

/* ---------- estados ---------- */
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;
  border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.t-ok{color:var(--moss)} .t-warn{color:var(--amber)} .t-stop{color:var(--lava)}
.t-mute{color:var(--muted)}

.links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.links a{display:block;background:var(--basalt-2);border:1px solid var(--basalt-3);
  border-radius:12px;padding:11px 12px;text-decoration:none;color:var(--text);font-size:14px}
.links a s{display:block;text-decoration:none;font-size:11.5px;color:var(--muted);margin-top:1px}
.links a.sos{border-color:var(--lava);color:var(--lava)}

.mini{font-size:12px;color:var(--muted)}
.err{color:var(--amber);font-size:12.5px}
footer{padding:18px 0 30px;font-size:11.5px;color:var(--muted);line-height:1.5}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--moss)}
.dot.old{background:var(--amber)}
.dot.dead{background:var(--lava)}
.sub{width:100%;text-align:left;background:none;border:0;padding:0}
@media (prefers-reduced-motion:no-preference){
  .verdict{transition:border-color .2s}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div class="clock" id="clock">--:--<span>Islandia</span></div>
      <button class="refresh" id="refresh">Actualizar</button>
    </div>
    <div class="daychip" id="daychip"></div>
    <div class="days" id="days"></div>
  </header>

  <div class="verdict" id="verdict">
    <h1 id="vtitle">Cargando…</h1>
    <p class="leg" id="vleg"></p>
    <ul class="reasons" id="vreasons"></ul>
  </div>

  <section>
    <h2>Ráfagas máximas de hoy, parada por parada</h2>
    <div class="strip" id="wind"></div>
    <p class="mini" id="windnote"></p>
  </section>

  <section>
    <h2>Luz</h2>
    <div class="card">
      <div id="lightsum"></div>
      <div class="light" id="lightbar"></div>
      <div class="lseg" id="lightlabels"></div>
    </div>
  </section>

  <section>
    <h2>El día</h2>
    <div class="card" id="plan"></div>
  </section>

  <section>
    <h2>Dormir</h2>
    <div class="card" id="camp"></div>
  </section>

  <section>
    <h2>Comida, gasolina y baños</h2>
    <div class="card" id="services"></div>
  </section>

  <section>
    <h2>Auroras</h2>
    <div class="card" id="aurora"></div>
  </section>

  <section>
    <h2>Estado de carreteras</h2>
    <div class="card" id="roads"></div>
  </section>

  <section>
    <h2>Abrir fuera de la app</h2>
    <div class="links" id="links"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* ===================== UTILIDADES ===================== */
/* Islandia es UTC todo el año y no cambia a horario de verano,
   así que la hora local del viaje y la hora UTC son la misma cosa. */
const pad=n=>String(n).padStart(2,"0");
const hhmm=d=>pad(d.getUTCHours())+":"+pad(d.getUTCMinutes());
const isoDay=d=>d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
const nowIS=()=>new Date();
const minsOf=s=>{const[a,b]=s.split(":").map(Number);return a*60+b};
const DOW=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MON=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function prettyDate(iso){const d=new Date(iso+"T12:00:00Z");
  return DOW[d.getUTCDay()]+" "+d.getUTCDate()+" "+MON[d.getUTCMonth()]}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}

/* --- posición del sol (algoritmo NOAA, todo en UTC) --- */
const rad=Math.PI/180,dayMs=864e5,J1970=2440588,J2000=2451545,e0=rad*23.4397;
const toJulian=d=>d.valueOf()/dayMs-0.5+J1970;
const fromJulian=j=>new Date((j+0.5-J1970)*dayMs);
const toDays=d=>toJulian(d)-J2000;
function sunTimes(date,lat,lng){
  const lw=rad*-lng,phi=rad*lat,d=toDays(date),
    n=Math.round(d-0.0009-lw/(2*Math.PI)),
    M=rad*(357.5291+0.98560028*(0.0009+lw/(2*Math.PI)+n)),
    L=M+rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M))+rad*102.9372+Math.PI,
    dec=Math.asin(Math.sin(e0)*Math.sin(L)),
    Jnoon=J2000+(0.0009+lw/(2*Math.PI)+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
  function ev(h){
    const co=(Math.sin(rad*h)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
    if(co>1||co<-1)return null;
    const w=Math.acos(co),
      Js=J2000+(0.0009+(w+lw)/(2*Math.PI)+n)+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
    return{rise:fromJulian(Jnoon-(Js-Jnoon)),set:fromJulian(Js)};
  }
  const s=ev(-0.833),c=ev(-6);
  return{sunrise:s&&s.rise,sunset:s&&s.set,dawn:c&&c.rise,dusk:c&&c.set,noon:fromJulian(Jnoon)};
}

/* ===================== ESTADO ===================== */
let sel=0, wx=null, wxErr=null, kp=null, roads=null, lastFetch=null;

function todayIndex(){
  const t=isoDay(nowIS());
  const i=DAYS.findIndex(d=>d.d===t);
  return i<0?null:i;
}
function gustClass(g){return g==null?"":g>=20?"g-stop":g>=15?"g-warn":"g-ok"}

/* ===================== DATOS EN VIVO ===================== */
async function loadWeather(day){
  const pts=[],seen=new Set();
  day.stops.forEach(s=>{const k=s.la.toFixed(2)+","+s.lo.toFixed(2);
    if(!seen.has(k)){seen.add(k);pts.push(s)}});
  const u="https://api.open-meteo.com/v1/forecast"
    +"?latitude="+pts.map(p=>p.la).join(",")
    +"&longitude="+pts.map(p=>p.lo).join(",")
    +"&hourly=temperature_2m,precipitation,cloud_cover,wind_speed_10m,wind_gusts_10m,weather_code"
    +"&wind_speed_unit=ms&timezone=UTC&start_date="+day.d+"&end_date="+day.d;
  const r=await fetch(u);
  if(!r.ok)throw new Error("open-meteo "+r.status);
  let j=await r.json();
  if(!Array.isArray(j))j=[j];
  return pts.map((p,i)=>({stop:p,h:j[i]&&j[i].hourly}));
}

async function loadKp(){
  const r=await fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json");
  const rows=await r.json();
  const last=rows[rows.length-1];
  return{kp:parseFloat(last[1]),when:last[0]};
}

/* El feed de Vegagerðin normalmente no manda cabeceras CORS, así que este
   intento falla en la mayoría de navegadores. Se prueba y, si falla, la
   tarjeta se queda con los enlaces directos. Nunca bloquea el resto. */
async function loadRoads(){
  const direct="https://gagnaveita.vegagerdin.is/api/faerd2017_1";
  const relay="https://api.allorigins.win/raw?url="+encodeURIComponent(direct);
  for(const [u,via] of [[direct,"oficial"],[relay,"vía relay público"]]){
    try{
      const r=await fetch(u,{cache:"no-store"});
      if(!r.ok)continue;
      const t=await r.text();
      const j=JSON.parse(t);
      const arr=Array.isArray(j)?j:(j.data||j.results||[]);
      if(arr.length)return{via,rows:arr};
    }catch(e){}
  }
  return null;
}

async function refresh(){
  const day=DAYS[sel];
  document.getElementById("refresh").textContent="…";
  wx=null;wxErr=null;
  try{wx=await loadWeather(day)}catch(e){wxErr=e.message}
  render();
  loadKp().then(k=>{kp=k;renderAurora()}).catch(()=>{});
  loadRoads().then(r=>{roads=r;renderRoads()}).catch(()=>{});
  lastFetch=new Date();
  document.getElementById("refresh").textContent="Actualizar";
  renderFoot();
}

/* ===================== CÁLCULOS ===================== */
function windowHours(day){
  // Si es hoy: de ahora a +6 h. Si no: todo el día entre la primera y la última parada.
  const isToday=isoDay(nowIS())===day.d;
  if(isToday){const h=nowIS().getUTCHours();return[h,Math.min(23,h+6)]}
  const a=Math.floor(minsOf(day.stops[0].h)/60);
  const b=Math.ceil(minsOf(day.stops[day.stops.length-1].h)/60);
  return[a,Math.min(23,b)];
}
function statsFor(series,day){
  if(!series||!series.h)return null;
  const[a,b]=windowHours(day);
  const g=series.h.wind_gusts_10m||[],t=series.h.temperature_2m||[],
        p=series.h.precipitation||[],c=series.h.cloud_cover||[];
  let mg=null,mt=null,tp=0,mc=null,n=0;
  for(let i=a;i<=b;i++){
    if(g[i]!=null){mg=mg==null?g[i]:Math.max(mg,g[i])}
    if(t[i]!=null){mt=mt==null?t[i]:Math.min(mt,t[i])}
    if(p[i]!=null){tp+=p[i]}
    if(c[i]!=null){mc=(mc||0)+c[i];n++}
  }
  return{gust:mg,tmin:mt,precip:tp,cloud:n?Math.round(mc/n):null};
}
function dayVerdict(day){
  if(wxErr||!wx)return{cls:"warn",title:"Sin pronóstico todavía",
    reasons:[["Motivo",wxErr?("No cargó el pronóstico: "+wxErr):"Cargando…"]]};
  const raw=wx.map(s=>statsFor(s,day));
  const all=raw.filter(Boolean);
  if(!all.length)return{cls:"warn",title:"Sin datos",reasons:[]};
  const gust=Math.max(...all.map(s=>s.gust??0));
  const tmin=Math.min(...all.map(s=>s.tmin??99));
  const precip=Math.max(...all.map(s=>s.precip??0));
  const wi=raw.findIndex(s=>s&&(s.gust??0)===gust);
  const worst=wi>=0?wx[wi]:null;
  const R=[];
  R.push(["Ráfaga máx", Math.round(gust)+" m/s ("+Math.round(gust*3.6)+" km/h) en "+(worst?worst.stop.n:"ruta")]);
  R.push(["Temperatura", Math.round(tmin)+" °C mínima en ruta"]);
  R.push(["Lluvia/nieve", precip.toFixed(1)+" mm en la ventana"]);
  R.push(["Manejo", day.km+" km · ~"+day.drive+" h"]);
  let cls="ok",title="Condiciones normales para la van";
  if(gust>=15){cls="warn";title="Ojo con el viento"}
  if(tmin<=1&&precip>0.4){cls="warn";title="Riesgo de hielo en la carretera"}
  if(gust>=20){cls="stop";title="No abras las puertas de la van"}
  if(gust>=25){cls="stop";title="No manejes con esto"}
  if(cls==="stop")R.unshift(["Qué hacer",gust>=25
    ?"Quedarse en el camping o en un pueblo hasta que baje. Una puerta arrancada es el daño número uno en rentas islandesas."
    :"Estacionar con la trompa contra el viento y abrir las puertas agarrando firme con las dos manos."]);
  if(cls==="warn"&&gust>=15)R.unshift(["Qué hacer","Bajar la velocidad, las dos manos en el volante y cuidado al pasar camiones y al salir de túneles."]);
  // luz
  const first=day.stops[0],st=sunTimes(new Date(day.d+"T12:00:00Z"),first.la,first.lo);
  if(st.sunset){
    const end=minsOf(day.stops[day.stops.length-1].h);
    const ss=st.sunset.getUTCHours()*60+st.sunset.getUTCMinutes();
    if(end>ss+30)R.push(["Luz","El plan termina "+Math.round((end-ss)/60*10)/10+" h después del atardecer. Llevar frontales."]);
  }
  return{cls,title,reasons:R};
}

function renderWind(){

    :"Cargando…")+"</p>";document.getElementById("windnote").textContent="";return}
  el.innerHTML=wx.map(s=>{
    const st=statsFor(s,day);if(!st)return"";
    const g=st.gust==null?null:Math.round(st.gust);
    return "<div class='wp "+gustClass(g)+"'><div class='nm'>"+s.stop.n+"</div>"
      +"<div class='g'>"+(g??"–")+" <s>m/s</s></div>"
      +"<div class='m'>"+(st.tmin==null?"":Math.round(st.tmin)+"°C · ")
      +(st.precip?st.precip.toFixed(1)+" mm":"seco")+"</div></div>";
  }).join("");
  const[a,b]=windowHours(day);
  document.getElementById("windnote").textContent=
    "Ventana "+pad(a)+":00–"+pad(b)+":00. Verde <15 m/s · ámbar 15–20 · rojo 20+. "

function renderLight(){
  const day=DAYS[sel],s0=day.stops[0];
  const st=sunTimes(new Date(day.d+"T12:00:00Z"),s0.la,s0.lo);
  const sum=document.getElementById("lightsum");
  if(!st.sunrise){sum.textContent="Sin datos de sol.";return}
  const dawn=st.dawn?hhmm(st.dawn):"–",sr=hhmm(st.sunrise),ss=hhmm(st.sunset),
        dusk=st.dusk?hhmm(st.dusk):"–";
  const hrs=((st.sunset-st.sunrise)/36e5).toFixed(1);
  let extra="";
  if(isoDay(nowIS())===day.d){
    const left=(st.sunset-nowIS())/36e5;
    extra=left>0?" · te quedan "+left.toFixed(1)+" h de luz":" · ya se hizo de noche";
  }
  sum.innerHTML="<b>"+hrs+" h de sol</b> <span class='mini'>en "+s0.n.split("—")[0].trim()+extra+"</span>";
  const day0=0,day1=1440;
  const m=d=>d?(d.getUTCHours()*60+d.getUTCMinutes()):0;
  const segs=[["#0E1D25",0,m(st.dawn)],["#2C4A5C",m(st.dawn),m(st.sunrise)],

    ["#0E1D25",m(st.dusk),1440]];
  document.getElementById("lightbar").innerHTML=segs.map(s=>
    "<i style='background:"+s[0]+";width:"+((s[2]-s[1])/1440*100)+"%'></i>").join("");
  document.getElementById("lightlabels").innerHTML=
    "<span>hora azul "+dawn+"</span><span>sale "+sr+"</span><span>se pone "+ss+"</span><span>noche "+dusk+"</span>";
}

function renderAurora(){
  const el=document.getElementById("aurora"),day=DAYS[sel];

      if(c.length)cloud=Math.round(c.reduce((a,b)=>a+b,0)/c.length);
    }
  }
  const k=kp?kp.kp:null;
  const kcls=k==null?"t-mute":k>=5?"t-ok":k>=3?"t-warn":"t-mute";
  const ktxt=k==null?"cargando":k>=5?"fuerte":k>=3?"decente":"flojo";

    +"<div class='note'>Con Kp 3 ya se ven desde Islandia si el cielo está despejado. "
    +"Lo que manda de verdad son las nubes.</div></div></div>"
    +"<div class='row'><div class='what'><b>Nubes en el camping, 20:00–23:00: "
    +(cloud==null?"–":cloud+" %")+"</b>"
    +"<div class='note'>"+(cloud==null?"Sin pronóstico todavía."
      :cloud<40?"Vale la pena poner el despertador."
      :cloud<75?"Puede abrirse a ratos. Revisar antes de dormir."
      :"Cerrado. Mejor dormir.")+"</div>"
    +"<div class='note'><a href='https://en.vedur.is/weather/forecasts/aurora/'>Pronóstico de auroras del Veðurstofan</a></div>"
    +"</div></div>";
}
function renderRoads(){
  const day=DAYS[sel],el=document.getElementById("roads");
  const reg=REGION[day.d];
  let head="";
  if(roads){
    head="<div class='row'><div class='what'><b>Feed de Vegagerðin cargado</b> "
      +"<span class='tag t-ok'>"+roads.via+"</span>"
      +"<div class='note'>"+roads.rows.length+" tramos recibidos. Este feed es crudo y en islandés; "
      +"para leerlo bien usá el mapa.</div></div></div>";
  }else{
    head="<div class='row'><div class='what'><b>Estado en vivo: hay que abrirlo aparte</b>"
      +"<span class='tag t-warn'>sin CORS</span>"
      +"<div class='note'>Vegagerðin no deja que una página ajena lea su feed desde el navegador. "
      +"Sin un backend propio, el mapa oficial se abre con un toque. Es el primer chequeo de cada mañana.</div>"
      +"</div></div>";
  }
  el.innerHTML=head
   +"<div class='row'><div class='what'><b>Región de hoy: "+reg+"</b>"
   +"<div class='note'><a href='https://umferdin.is/en'>Mapa de carreteras (umferdin.is)</a> · "
   +"<a href='https://umferdin.is/en/vefmyndavelar'>Cámaras en vivo</a></div></div></div>"
   +"<div class='row'><div class='what mini'>Umferdin actualiza de 07:00 a 22:00 entre el 1 de octubre y el 30 de abril, "
   +"y de 08:00 a 16:00 el resto del año. Del 27 al 30 de septiembre la última actualización del día es a las 16:00.</div></div>";
}
function renderLinks(){
  const L=[
   ["https://umferdin.is/en","Carreteras","umferdin.is · estado y cierres"],
   ["https://en.vedur.is/weather/forecasts/areas/","Clima oficial","vedur.is · viento por hora"],
   ["https://safetravel.is/alerts","Alertas","safetravel.is · avisos y rescate"],
   ["https://krapp.is/","Baños","Krapp · mapa colaborativo"],
   ["https://tjalda.is/is/","Campings","tjalda.is · directorio"],
   ["https://www.gocampers.is/grocery-stores-gas-stations/","Súper y gasolina","GoCampers · lista por región"],
   ["https://park4night.com/","Park4Night","paradas y servicios"],
   ["https://www.landsvirkjun.is/rauntimavoktun/vatnshaed-halslons","Caudal de Hálslón","decide si Stuðlagil vale la pena"],
   ["https://en.vedur.is/earthquakes-and-volcanism/","Volcanes","actividad en Reykjanes"],
   ["tel:112","Emergencias 112","gratis, sin SIM, en toda la isla"]
  ];
  document.getElementById("links").innerHTML=L.map(l=>
    "<a href='"+l[0]+"'"+(l[0]==="tel:112"?" class='sos'":"")+">"+l[1]+"<s>"+l[2]+"</s></a>").join("");
}
function renderFoot(){
  const t=todayIndex();
  let dot="dead",txt="sin actualizar";
  if(lastFetch){const m=(Date.now()-lastFetch)/6e4;
    dot=m<20?"live":m<120?"old":"dead";
    txt="datos de hace "+(m<1?"menos de 1 min":Math.round(m)+" min");}
  document.getElementById("foot").innerHTML=
    "<span class='pill'><i class='dot "+dot+"'></i>"+txt+"</span><br><br>"
    +"Pronóstico: Open-Meteo. Kp: NOAA SWPC. Sol: calculado en el teléfono, funciona sin señal. "
    +"Carreteras y alertas: enlaces a Vegagerðin y Safetravel, que son la fuente que manda. "
    +"Los horarios de súper son típicos y hay que verificarlos. "
    +(t==null?"Hoy no es un día del viaje, así que no hay “ahora” que marcar.":"");
}
function render(){
  renderDays();renderVerdict();renderWind();renderLight();
  renderPlan();renderCamp();renderServices();renderAurora();renderRoads();renderFoot();
}

/* ===================== ARRANQUE ===================== */
function tick(){
  const n=nowIS();
  document.getElementById("clock").innerHTML=hhmm(n)+"<span>Islandia</span>";
  const t=todayIndex();
  document.getElementById("daychip").textContent=
    t==null?prettyDate(isoDay(n))+" · faltan "+Math.max(0,Math.round((new Date("2026-09-27T09:30:00Z")-n)/dayMs))+" días para el vuelo"
           :"Día "+(t+1)+" de 11 · "+DAYS[t].t;
}
renderLinks();
sel=todayIndex()??0;
tick();setInterval(tick,30000);
render();
refresh();
document.getElementById("refresh").onclick=refresh;
</script>
</body>
</html>
